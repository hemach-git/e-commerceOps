app:
  name: "Marketplace Catalog Ingestion Engine"
  version: "0.1.0"
  data_label: "SYNTHETIC DEMO DATA"

llm:
  provider: mock            # mock | anthropic | ollama   (env override: LLM_PROVIDER)
  model: claude-sonnet-5-5  # env override: LLM_MODEL
  max_tokens: 1024
  temperature: null         # null = provider default
  max_retries: 2            # structural-validation retries per LLM call
  timeout_s: 30
  ollama:                   # used when provider is ollama (local model, no API key)
    url: http://localhost:11434   # env override: OLLAMA_URL
    model: llama3:8b              # env override: OLLAMA_MODEL
    timeout_s: 180
    temperature: 0.0

sku:
  # Three-digit category codes used in marketplace SKUs: MP-<category>-<feed>-<variant>. Never reuse a code.
  category_codes:
    APP-SHORTS-M: 10
    APP-LEGGINGS-W: 11
    APP-TEES: 12
    FTW-RUN: 20
    HOME-COOK: 30
    ELEC-CHRG: 40
    HLTH-SUPP: 50
    TOYS-BLD: 60

pipeline:
  confidence_threshold: 0.70
  min_title_len: 10
  max_title_len: 150
  max_input_title_chars: 500
  max_input_bullets_chars: 4000
  max_price: 10000
  batch_limit: 200

compliance:
  # Global prohibited terms (word-boundary, case-insensitive). Category-specific terms live in canonical_categories.prohibited_keywords.
  global_prohibited_keywords:
    - replica
    - counterfeit
    - knockoff
    - knock-off
    - "inspired by"
    - "1:1 copy"
    - firearm
    - ammunition
    - vape cartridge
    # unsubstantiated health/regulatory claims are banned in every category
    - cures
    - "fda approved"
    - "treats cancer"
    - "miracle cure"

paths:
  db: data/catalog.db       # env override: CATALOG_DB_PATH
  log: logs/app.jsonl
  eval_results: evals/results
  run_snapshots: logs/run_snapshots
